  color_bulb_9mu7:
    product:
      prod_id: 9MU7
      sub_prod_id: "00"
      device_type: "119"
      manufacturer: "002"
      model: haTest10
      friendly_name: 智控灯泡
      room: 客厅
      protocol_type: 6
      setup_type: 0
      known_fields_only: false
      services:
        - st: switch
          sid: switch
        - st: brightness
          sid: brightness
          contract:
            min: 1
            max: 100
            step: 1
        - st: cct
          sid: cct
      bindings:
        - sid: switch
          entities: [light.REPLACE_WITH_COLOR_BULB]
        - sid: brightness
          entities: [light.REPLACE_WITH_COLOR_BULB]
        - sid: cct
          entities: [light.REPLACE_WITH_COLOR_BULB]

